name: MindGuard Full Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Vulnerability / DAST Tests
  # ─────────────────────────────────────────
  vulnerability-tests:
    name: 🔐 Vulnerability & DAST Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: automated_test/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: automated_test

      - name: Run DAST Vulnerability Tests
        run: node run_dast.js
        working-directory: automated_test
        env:
          TARGET_URL: ${{ secrets.TARGET_URL || 'http://localhost:5000' }}
          NODE_ENV: test
        continue-on-error: true

      - name: Upload Vulnerability Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: |
            automated_test/report.json
            Vulnerability Test Results/*.xlsx
            Vulnerability Test Results/*.md
          retention-days: 30

  # ─────────────────────────────────────────
  # JOB 2: Selenium Web Tests
  # ─────────────────────────────────────────
  selenium-tests:
    name: 🌐 Selenium Web Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: selenium_tests/package-lock.json

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm install
        working-directory: selenium_tests

      - name: Run Selenium Tests
        run: node run_tests.js
        working-directory: selenium_tests
        env:
          TARGET_URL: ${{ secrets.TARGET_URL || 'http://localhost:5000' }}
          HEADLESS: 'true'
          NODE_ENV: test
        continue-on-error: true

      - name: Upload Selenium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-report
          path: selenium_tests/selenium_report.xlsx
          retention-days: 30

  # ─────────────────────────────────────────
  # JOB 3: Appium Mobile Tests
  # ─────────────────────────────────────────
  appium-tests:
    name: 📱 Appium Mobile Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: appium_tests/package-lock.json

      - name: Setup Java (required for Appium)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Appium
        run: npm install -g appium

      - name: Install UIAutomator2 Driver
        run: appium driver install uiautomator2

      - name: Install dependencies
        run: npm install
        working-directory: appium_tests

      - name: Run Appium Tests
        run: node run_tests.js
        working-directory: appium_tests
        env:
          TARGET_URL: ${{ secrets.TARGET_URL || 'http://localhost:5000' }}
          NODE_ENV: test
          CI: 'true'
        continue-on-error: true

      - name: Upload Appium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-report
          path: appium_tests/appium_report.xlsx
          retention-days: 30

  # ─────────────────────────────────────────
  # JOB 4: Summary
  # ─────────────────────────────────────────
  test-summary:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs: [vulnerability-tests, selenium-tests, appium-tests]
    if: always()

    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: List all downloaded reports
        run: ls -la all-reports/**

      - name: Post Summary
        run: |
          echo "## ✅ MindGuard Test Suite Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Vulnerability / DAST | ${{ needs.vulnerability-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Selenium Web Tests   | ${{ needs.selenium-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Appium Mobile Tests  | ${{ needs.appium-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All reports are available as **downloadable artifacts** above." >> $GITHUB_STEP_SUMMARY
