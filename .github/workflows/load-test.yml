name: 🚀 API Load Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  load-test:
    name: Run API Load Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root and backend dependencies
        run: |
          npm install
          npm install --prefix backend

      - name: Start Backend Server
        run: |
          npm run start --prefix backend &
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/mindguard
          JWT_SECRET: 44efee2d3587b1c3b1ea0d6b9d6eb9f310f8be354c46fcf85906efc1cd3494ab13df5d3c8cfa2b9adcb1b58ad44c80387ba94cc9b0b467e411b953d6fcf4f54d
          JWT_EXPIRES_IN: 7d
          RESEND_API_KEY: mocked_key
          ADMIN_EMAIL: emergency-alerts@mindguard.com
          CLIENT_URL: http://localhost:5173
          NODE_ENV: development
          SEED_PASSWORD: LoadTestPassword123!
          DISABLE_RATE_LIMITS: "true"

      - name: Wait for backend to start
        run: |
          for i in {1..30}; do
            curl -s http://localhost:5000 > /dev/null && break
            echo "Waiting for backend to be ready..."
            sleep 2
          done

      - name: Install load test dependencies
        run: npm install
        working-directory: automated_test

      - name: Run Load Test
        run: node run_load_test.js
        working-directory: automated_test
        env:
          MONGODB_URI: mongodb://localhost:27017/mindguard

      - name: Upload Load Test Report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: automated_test/load_test_report.xlsx
          retention-days: 30
