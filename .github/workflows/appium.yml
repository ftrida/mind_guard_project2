name: appium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  appium-tests:
    name: Run Appium Mobile Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: appium_tests/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: appium_tests

      - name: Run Appium Tests
        run: node run_tests.js
        working-directory: appium_tests
        env:
          TARGET_URL: ${{ secrets.TARGET_URL || 'http://localhost:5000' }}
          NODE_ENV: test
          CI: 'true'
        continue-on-error: true

      - name: Upload Appium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-report
          path: appium_tests/appium_report.xlsx
          retention-days: 30
